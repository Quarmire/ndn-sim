[package]
name = "ndn-sim"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "In-process NDN network simulation with configurable link properties"
# P1 compile-cost: the tests/*.rs files are consolidated into the single
# `suite` test binary below (one link instead of ~53).
autotests = false

[package.metadata.scope]
classification = "research"

[dependencies]
ndn-transport = { workspace = true }
ndn-engine    = { workspace = true }
ndn-runtime   = { workspace = true }
ndn-packet    = { workspace = true, features = ["std"] }
ndn-store     = { workspace = true }
ndn-frame-io  = { workspace = true }
ndn-signals-core = { workspace = true }
ndn-strategy  = { workspace = true }
ndn-mgmt      = { workspace = true }
# Boot sim nodes from ndn-fwd TOML through the same code ndn-fwd runs (`ndn_config::boot`).
ndn-config    = { workspace = true }
ndn-observability = { workspace = true }
# Real UDP transport for the interop bridge (slice 9).
ndn-face      = { workspace = true }
# Used by the control plane to serve /localhop/sim/control as an NDN producer.
ndn-app       = { workspace = true }
# Signed-Interest verification for authenticated control-over-NDN (mutating commands).
ndn-security  = { workspace = true }
# The fieldkit scenario primitives (two-phase replica plane, burst/restart shapes) ride the
# real sync layer — that's the point: they must exercise the STOCK channel geometry.
ndn-sync      = { workspace = true }

# The Keel (`keel` feature, off by default): ndn-lab as a consumer of the manifest/render-contract
# calculus. Zero-dep spec crates + the tool-tier `explain` micro-crate, pulled by path from the
# sibling flotilla repo (they carry no transitive deps — C7). Optional so the core simulator builds
# and tests with no flotilla checkout at all.
manifest              = { path = "../../../flotilla/crates/core/manifest", optional = true }
render-contract       = { path = "../../../flotilla/crates/core/render-contract", optional = true }
explain               = { path = "../../../flotilla/crates/tools/explain", optional = true }
manifest-describe     = { path = "../../../flotilla/crates/tools/manifest-describe", optional = true }
manifest-derive       = { path = "../../../flotilla/crates/tools/manifest-derive", optional = true }

serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
# WebSocket control transport (browser / Dioxus dashboard clients).
tokio-tungstenite = { workspace = true }
futures    = { workspace = true }

bytes       = { workspace = true }
# `test-util` enables the paused single-threaded runtime the VirtualKernel drives;
# `io-std`/`io-util` back the MCP stdio JSON-RPC server loop.
tokio       = { workspace = true, features = ["sync", "time", "rt", "macros", "test-util", "io-std", "io-util", "net"] }
tokio-util  = { workspace = true }
tracing     = { workspace = true }
# Capture the engine's own tracing spans into the virtual-clocked span store.
tracing-subscriber = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
rand        = "0.9"
parking_lot = "0.12"
# CLI — only pulled in by the `bin` feature.
clap        = { workspace = true, optional = true }
# ArduPilot SITL co-sim — only pulled in by the `mavlink` feature (keeps the core build lean).
mavlink     = { version = "0.13", optional = true, default-features = false, features = ["common", "udp", "std"] }

[features]
# The `ndn-lab` binary (run / serve / mcp / replay).
bin = ["dep:clap", "tokio/rt-multi-thread", "tokio/signal"]
# ArduPilot SITL (MAVLink) co-sim adapter + the `ndn-lab fly` command.
mavlink = ["dep:mavlink"]
# Self-describing telemetry through render contracts (`ndn_sim::keel`, `#[derive(Manifest)]` on
# `FabricGauges` / the scene types). Requires the sibling `flotilla` checkout.
keel = [
    "dep:manifest",
    "dep:render-contract",
    "dep:explain",
    "dep:manifest-describe",
    "dep:manifest-derive",
]

[[bin]]
name = "ndn-lab"
path = "src/bin/ndn-lab.rs"
required-features = ["bin"]

# One consolidated integration-test binary (see `autotests = false` above).
# tests/suite.rs pulls every tests/*.rs file in as a `#[path]` module.
[[test]]
name = "suite"
path = "tests/suite.rs"

[dev-dependencies]
tokio      = { workspace = true, features = ["full"] }
# Sign control Interests in the authenticated-control-over-NDN test.
ndn-security = { workspace = true }
# tests/field_faults.rs: the D-42 history-serving gates drive a real ndn-repo (two-phase mode).
ndn-repo     = { workspace = true }
# multihop.rs / relay_hops.rs: pipe relaying over a simulated multi-hop net.
ndn-coding       = { workspace = true }
ndn-pipes        = { workspace = true }
# tests/field_faults.rs: seed ndn-sync's thread-local suppression jitter for reproducible runs.
fastrand         = "2"

[[example]]
name = "keel-telemetry"
required-features = ["keel"]

[[example]]
name = "keel-live"
required-features = ["keel"]
