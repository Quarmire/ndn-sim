# A validation of NDN's core resilience property: DATA OUTLIVES ITS PRODUCER.
#
#   producer(0) ── relay(1) ── consumerA(2)
#                     │
#                  consumerB(3)
#
# 1. consumerA fetches /svc/0..19 through the relay, which caches every (fresh) Data in its CS.
# 2. At t=2.5s we KILL the producer.
# 3. At t=3s a fresh consumerB joins and fetches the SAME /svc/0..19 — served entirely from the
#    relay's cache. The origin is gone, yet the data is still reachable: disruption-tolerant,
#    in-network caching, the property that separates content-centric networking from host-centric
#    transport.
#
# (This only works because the producer stamps a FreshnessPeriod — a forwarder's default admission
# policy, like NFD's, won't cache FreshnessPeriod=0 Data.)
#
# Run it:   ndn-lab check examples/checks/cache-survives-producer.toml

duration_ms = 6000
kernels = ["des", "virtual"]

[scenario.kernel]
kind = "des"

[[scenario.nodes]]
label = "producer"
[[scenario.nodes.apps]]
app = "producer"
prefix = "/svc"
content = "cached-and-durable"

[[scenario.nodes]]
label = "relay"

[[scenario.nodes]]
label = "consumerA"
[[scenario.nodes.apps]]
app = "consumer"
prefix = "/svc"
count = 20
interval_ms = 100

[[scenario.nodes]]
label = "consumerB"

[[scenario.links]]
a = 0
b = 1
delay_ms = 3
[[scenario.links]]
a = 1
b = 2
delay_ms = 3
[[scenario.links]]
a = 1
b = 3
delay_ms = 3

[[scenario.routes]]
node = 2
prefix = "/svc"
nexthop = 1
[[scenario.routes]]
node = 1
prefix = "/svc"
nexthop = 0
[[scenario.routes]]
node = 3
prefix = "/svc"
nexthop = 1

[[faults]]
at_ms = 2500
fault = { kind = "remove_node", node = 0 }

[[faults]]
at_ms = 3000
fault = { kind = "spawn_app", node = 3, app = { app = "consumer", prefix = "/svc", count = 20, interval_ms = 100 } }

[[properties]]
name = "consumerA fetched all 20 from the live producer"
probe = { kind = "app_successes", app = 1 }
cmp = "ge"
value = 20

[[properties]]
name = "consumerB fetched all 20 AFTER the producer died (served from cache)"
probe = { kind = "app_successes", app = 2 }
cmp = "ge"
value = 20

[[properties]]
name = "the relay actually cached forwarded Data"
probe = { kind = "metric", field = "cs_inserts", node = 1 }
cmp = "ge"
value = 20
