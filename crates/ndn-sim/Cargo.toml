[package]
name = "ndn-sim"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "In-process NDN network simulation with configurable link properties"

[package.metadata.scope]
classification = "research"

[dependencies]
ndn-transport = { workspace = true }
ndn-engine    = { workspace = true }
ndn-runtime   = { workspace = true }
ndn-packet    = { workspace = true, features = ["std"] }
ndn-store     = { workspace = true }
ndn-frame-io  = { workspace = true }
ndn-signals-core = { workspace = true }
ndn-strategy  = { workspace = true }
ndn-mgmt      = { workspace = true }
ndn-observability = { workspace = true }
# Real UDP transport for the interop bridge (slice 9).
ndn-face      = { workspace = true }
# Used by the control plane to serve /localhop/sim/control as an NDN producer.
ndn-app       = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }

bytes       = { workspace = true }
# `test-util` enables the paused single-threaded runtime the VirtualKernel drives;
# `io-std`/`io-util` back the MCP stdio JSON-RPC server loop.
tokio       = { workspace = true, features = ["sync", "time", "rt", "macros", "test-util", "io-std", "io-util", "net"] }
tokio-util  = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
rand        = "0.9"

[dev-dependencies]
tokio      = { workspace = true, features = ["full"] }
