[package]
name = "ndn-data-conformance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Conformance cases for the ndn-data contract: the data-layer study's use cases as deterministic ndn-sim scenarios"
publish = false

[package.metadata.scope]
classification = "research"

[[bin]]
name = "ndn-data-conformance"
path = "src/main.rs"

[dependencies]
ndn-sim     = { path = "../ndn-sim" }
ndn-data    = { workspace = true }
ndn-app     = { workspace = true }
ndn-security = { workspace = true }
ndn-sync    = { workspace = true }
# Introduction codes the cases alter; anchor links the reference provider adopts.
ndn-trust-envelope = { workspace = true }
# A device's sync groups set up as a daemon's libraries set them up (`reference`).
ndn-namespace = { workspace = true }
ndn-link    = { workspace = true }
# Trust-context versions signed as the root flow signs them: revocations with cuts,
# re-admissions, recovery kits and recovery (`reference`).
ndn-cert    = { workspace = true }
# An anchor link adopted through a node's engine, as the daemon adopts one: a self-certifying
# namespace fetched by its name alone (`reference`).
ndn-identity = { workspace = true }
tokio-util  = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
bytes       = { workspace = true, features = ["std"] }
futures     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["rt", "time", "macros", "test-util"] }
# Seeds ndn-sync's thread-local jitter before each case, so a case replays identically (`runner`).
fastrand    = "2"
# The reference provider's seeded audit randomness: SHA-256 over the device name and a counter.
sha2        = "0.11"
# The runner's diagnostics: `RUST_LOG=ndn_data=debug` shows why a case's devices refused or
# missed something.
tracing-subscriber = { workspace = true }
# The audit relay the reference provider injects signs and asks with packets of its own.
ndn-packet = { workspace = true }
