[workspace]
resolver = "2"
members = [
    "crates/ndn-sim",
]
default-members = [
    "crates/ndn-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ndn-rs contributors"]
license = "MIT OR Apache-2.0"

[workspace.metadata.crane]
name = "ndn-sim"

[workspace.dependencies]
# NDN workspace crates — grouped by subdirectory layer
ndn-packet    = { path = "../ndn-rs/crates/core/ndn-packet", default-features = false }
ndn-transport = { path = "../ndn-rs/crates/core/ndn-transport" }
ndn-runtime   = { path = "../ndn-rs/crates/core/ndn-runtime" }
ndn-face      = { path = "../ndn-rs/crates/faces/ndn-face" }
# Relocated in P2/D5: the radio foundation crates live in ndn-radio-drivers now.
ndn-frame-io  = { path = "../ndn-radio-drivers/crates/ndn-frame-io" }
ndn-signals-core = { path = "../ndn-rs/crates/core/ndn-signals-core" }
ndn-store     = { path = "../ndn-rs/crates/forwarding/ndn-store" }
ndn-strategy  = { path = "../ndn-rs/crates/forwarding/ndn-strategy" }
ndn-mgmt      = { path = "../ndn-rs/crates/forwarding/ndn-mgmt" }
ndn-engine    = { path = "../ndn-rs/crates/forwarding/ndn-engine" }
# OTLP span types + NDN-native publisher; default-features off drops the
# process-global tracing-subscriber Layer (the sim feeds virtual-clock timestamps directly).
ndn-observability = { path = "../ndn-rs/crates/platform/ndn-observability", default-features = false }
ndn-app       = { path = "../ndn-rs/crates/app/ndn-app" }
ndn-security  = { path = "../ndn-rs/crates/security/ndn-security" }
# Named-time (dev-only): the convergence demo drives real Timekeepers + beacon
# wire. ndn-time is in ndn-rs; the runtime + sources live in ndn-ext.
ndn-time         = { path = "../ndn-rs/crates/core/ndn-time" }
ndn-time-sources = { path = "../ndn-ext/crates/time/ndn-time-sources" }
ndn-timekeeper   = { path = "../ndn-ext/crates/time/ndn-timekeeper" }
ndn-coding       = { path = "../ndn-ext/crates/coding/ndn-coding" }
ndn-radio-cognition = { path = "../ndn-ext/crates/faces/ndn-radio-cognition" }
ndn-pipes        = { path = "../ndn-ext/crates/pipes/ndn-pipes" }
ndn-sync         = { path = "../ndn-rs/crates/protocols/ndn-sync" }
# Test-only: the D-42 history-serving gates drive a real `ndn-repo` in two-phase mode.
# `default-features = false` drops the fjall on-disk store — the gates use `MemoryStore`.
ndn-repo         = { path = "../ndn-repo/crates/ndn-repo", default-features = false }

# Core async runtime — individual crates enable only the features they need
tokio      = { version = "1", default-features = false }
tokio-util = { version = "0.7.10", default-features = false }

# Zero-copy byte buffers (no default features — crates opt in to bytes/std explicitly)
bytes = { version = "1", default-features = false }

# Declarative scenario files (ndn-lab run scenario.toml)
toml = "0.8"

# CLI for the `ndn-lab` binary
clap = { version = "4", features = ["derive"] }

# Structured logging
tracing = "0.1"

# Async combinators and stream/sink extension traits
futures = "0.3"
async-trait = "0.1"

# Error handling
anyhow    = "1"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# WebSocket support
tokio-tungstenite = { version = "0.26" }

# Logging subscriber (binaries only)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Build profiles ─────────────────────────────────────────────────────────────

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
