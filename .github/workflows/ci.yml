name: CI — ndn-sim

# Path-deps ndn-rs + ndn-ext + ndn-radio + ndn-radio-drivers + ndn-repo + the private
# flotilla (Keel calculus) via ../ → sibling checkouts. flotilla is private, so its checkout
# needs a PAT. Cargo resolves every path dep's manifest even when its feature is off, so
# flotilla must be checked out although only `--features keel` compiles it.
#
# Every sibling pin below must contain the APIs ndn-sim builds against — bump them together.

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:
  schedule:
    # Weekly foreign-forwarder interop conformance run (the Tier-1 drift guard).
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: sim (fmt / clippy / test / doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-sim }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: "de09ff6ae8a77ae0f3ddf14d20c4ac4c6f169df8", path: ndn-rs } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: "27646a78bb0fd91a7f1fba1f295d5a9ad220fef6", path: ndn-ext } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: "05862c948e33f7e2ad8091d8729a5cee6fdfcba0", path: ndn-radio-drivers } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio", ref: "b4c3d96817ea4c8e50aaeeedca47462c5ac4054e", path: ndn-radio } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-repo", ref: "1350d96d7f3c2e9bae347112e4f1d33127e6681b", path: ndn-repo } # pinned sibling; bump deliberately
      # flotilla is PRIVATE (the Keel/Waterline content-calculus ndn-sim consumes).
      # A cross-repo private checkout needs a token: create a fine-grained PAT with
      # read access to Quarmire/flotilla and add it as the FLOTILLA_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/flotilla"
          ref: "ccf5591375524871919f974547047afa45e3a6dd" # pinned sibling; bump deliberately
          path: flotilla
          token: ${{ secrets.FLOTILLA_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ndn-sim/target
          key: ${{ runner.os }}-cargo-sim-${{ hashFiles('ndn-sim/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sim-
      # Scope fmt to ndn-sim's own members: `cargo fmt --all` also formats the
      # sibling path deps (ndn-rs / ndn-ext / flotilla), which aren't this repo's.
      - name: Format (ndn-sim members)
        working-directory: ndn-sim
        run: |
          PKGS=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys;print(' '.join('-p '+p['name'] for p in json.load(sys.stdin)['packages']))")
          cargo fmt $PKGS -- --check
      # --workspace covers the core simulator AND ndn-sim-studies; --all-features adds keel,
      # mavlink and the ndn-lab binary so no feature-gated code rots unbuilt.
      - name: Lint
        working-directory: ndn-sim
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Lint (default features — the flotilla-free core build)
        working-directory: ndn-sim
        run: cargo clippy -p ndn-sim --all-targets -- -D warnings
      - name: Test
        working-directory: ndn-sim
        run: cargo test --workspace --all-features
      # The rustdoc is the crate's manual; broken intra-doc links fail the build.
      - name: Doc build
        working-directory: ndn-sim
        env: { RUSTDOCFLAGS: "-D warnings" }
        run: cargo doc --no-deps --workspace --all-features

  # Opt-in Tier-1 interop conformance: the wire suite against a REAL foreign
  # forwarder (ndnd, Go). Never runs on push/PR — manual dispatch or the weekly
  # cron only — so normal CI stays hermetic and fast. Skips cleanly (the tests
  # self-SKIP) if the ndnd build ever fails to produce a binary.
  interop:
    name: interop (vs real ndnd)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-sim }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: "de09ff6ae8a77ae0f3ddf14d20c4ac4c6f169df8", path: ndn-rs } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: "27646a78bb0fd91a7f1fba1f295d5a9ad220fef6", path: ndn-ext } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: "05862c948e33f7e2ad8091d8729a5cee6fdfcba0", path: ndn-radio-drivers } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio", ref: "b4c3d96817ea4c8e50aaeeedca47462c5ac4054e", path: ndn-radio } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-repo", ref: "1350d96d7f3c2e9bae347112e4f1d33127e6681b", path: ndn-repo } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/flotilla"
          ref: "ccf5591375524871919f974547047afa45e3a6dd" # pinned sibling; bump deliberately
          path: flotilla
          token: ${{ secrets.FLOTILLA_TOKEN }}
      - uses: actions/checkout@v4
        with: { repository: named-data/ndnd, path: ndnd }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Build ndnd
        working-directory: ndnd
        run: go build -o /tmp/ndnd ./cmd/ndnd
      - name: Interop suite
        working-directory: ndn-sim
        # The interop tests live in the consolidated `suite` test binary
        # (autotests=false); filter to the interop_ndnd module's ignored tests.
        run: NDND_BIN=/tmp/ndnd cargo test -p ndn-sim --test suite -- interop_ndnd --ignored --nocapture
