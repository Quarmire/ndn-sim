# A validation of MULTICAST FAILOVER: with a multicast strategy the consumer survives a dead relay.
#
# Topology (a diamond — two disjoint paths to the producer):
#
#         relayA(1)
#        /         \
#   consumer(0)   producer(3)
#        \         /
#         relayB(2)
#
# The consumer forwards /svc with the `multicast` strategy, which fans every Interest to BOTH
# relays. One second in we kill relayA; because relayB is still flooded in parallel, the consumer
# completes all 30 fetches without interruption. (Best-route, by contrast, forwards to one next-hop
# and only fails over when the CONSUMER retransmits — see probes/README.md for that distinction.)
#
# Run it:   ndn-lab check examples/checks/relay-failover.toml
# Proven on both the DES and Virtual executors, with cross-executor counter agreement.

duration_ms = 6000
kernels = ["des", "virtual"]

[scenario.kernel]
kind = "des"

[[scenario.nodes]]
label = "consumer"
[[scenario.nodes.apps]]
app = "consumer"
prefix = "/svc"
count = 30
interval_ms = 100

[[scenario.nodes]]
label = "relayA"

[[scenario.nodes]]
label = "relayB"

[[scenario.nodes]]
label = "producer"
[[scenario.nodes.apps]]
app = "producer"
prefix = "/svc"
content = "resilient"

[[scenario.links]]
a = 0
b = 1
delay_ms = 3
[[scenario.links]]
a = 1
b = 3
delay_ms = 3
[[scenario.links]]
a = 0
b = 2
delay_ms = 3
[[scenario.links]]
a = 2
b = 3
delay_ms = 3

[[scenario.routes]]
node = 0
prefix = "/svc"
nexthop = 1
[[scenario.routes]]
node = 0
prefix = "/svc"
nexthop = 2
[[scenario.routes]]
node = 1
prefix = "/svc"
nexthop = 3
[[scenario.routes]]
node = 2
prefix = "/svc"
nexthop = 3

# The consumer floods both relays for /svc — the declarative failover knob.
[[scenario.strategies]]
node = 0
prefix = "/svc"
strategy = "multicast"

# Kill relayA one second in; relayB carries the flow.
[[faults]]
at_ms = 1000
fault = { kind = "remove_node", node = 1 }

[[properties]]
name = "consumer completes all 30 fetches despite the relay failure"
probe = { kind = "app_successes", app = 0 }
cmp = "ge"
value = 30

[[properties]]
name = "no PIT state leaks after failover"
probe = { kind = "metric", field = "pit_depth", agg = "max" }
cmp = "eq"
value = 0
