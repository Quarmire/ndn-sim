[package]
name = "ndn-data-conformance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Conformance cases for the ndn-data contract: the data-layer study's use cases as deterministic ndn-sim scenarios"
publish = false

[package.metadata.scope]
classification = "research"

[[bin]]
name = "ndn-data-conformance"
path = "src/main.rs"

[dependencies]
ndn-sim     = { path = "../ndn-sim" }
ndn-data    = { workspace = true }
ndn-app     = { workspace = true }
ndn-security = { workspace = true }
ndn-sync    = { workspace = true }
tokio-util  = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
bytes       = { workspace = true, features = ["std"] }
futures     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["rt", "time", "macros", "test-util"] }
# The runner's diagnostics: `RUST_LOG=ndn_data=debug` shows why a case's devices refused or
# missed something.
tracing-subscriber = { workspace = true }

[dev-dependencies]
ndn-packet = { workspace = true }
